version: 2

models:
  - name: fct_orders
    description: "Fact table containing order-level transactions, aggregated amounts, durations, and return statuses."
    columns:
      - name: order_id
        data_type: int64
        description: "Primary key of the order."
        tests:
          - unique
          - not_null

      - name: customer_id
        data_type: int64
        description: "Foreign key referencing dim_users."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: customer_id

      - name: order_status
        data_type: string
        description: "Current operational status of the order (e.g., Complete, Cancelled, Processing)."

      - name: total_items_count
        data_type: int64
        description: "Total number of items included in the order."

      - name: total_order_amount
        data_type: float64
        description: "Total monetary value of the order."

      - name: created_at
        data_type: timestamp
        description: "Timestamp when the order was placed."

      - name: shipped_at
        data_type: timestamp
        description: "Timestamp when the order was shipped."

      - name: delivered_at
        data_type: timestamp
        description: "Timestamp when the order was delivered to the customer."

      - name: returned_at
        data_type: timestamp
        description: "Timestamp when the order was returned."

      - name: shipping_duration_days
        data_type: int64
        description: "Number of days between order creation and shipping."

      - name: delivery_duration_days
        data_type: int64
        description: "Number of days between shipping and delivery."

      - name: is_returned
        data_type: boolean
        description: "Boolean flag indicating whether the order was returned."