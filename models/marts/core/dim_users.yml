version: 2

models:
  - name: dim_users
    description: ""
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
          

      - name: customer_first_name
        data_tests:
          - not_null
          


      - name: customer_last_name
        data_tests:
          - not_null

      - name: customer_full_name
        data_tests:
          - not_null

      - name: customer_age
        

      - name: age_group
        data_tests:
          - accepted_values:
              arguments:
                values: ['unknown', 'under 18', '18-25', '26-45', '46-60', '+60']

      - name: customer_gender
        data_tests:
          - accepted_values:
              arguments:
                values: ['f', 'm']

      - name: customer_email
        data_type: string
        description: ""

      - name: customer_street_address
        data_type: string
        description: ""

      - name: customer_postal_code
        data_type: string
        description: ""

      - name: customer_city
        data_type: string
        description: ""

      - name: customer_state
        data_type: string
        description: ""

      - name: customer_country
        data_type: string
        description: ""

      - name: customer_latitude
        data_type: float64
        description: ""

      - name: customer_longitude
        data_type: float64
        description: ""

      - name: customer_geom
        data_type: geography
        description: ""

      - name: customer_traffic_source
        data_tests:
          - accepted_values:
              arguments:
                values: ['search', 'organic', 'email', 'display', 'facebook']

      - name: created_at
        data_type: timestamp
        description: ""

      - name: signup_cohort
        data_type: timestamp
        description: ""