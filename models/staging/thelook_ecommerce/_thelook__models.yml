version: 2

models:
  - name: stg_thelook_ecommerce__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_thelook_ecommerce__users')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['cancelled' , 'complete' , 'processing' , 'returned' , 'shipped']
      - name: customer_gender
      - name: number_of_items
      - name: created_at
      - name: shipped_at
      - name: delivered_at
      - name: returned_at

--stg_thelook_ecommerce__users

  - name: stg_thelook_ecommerce__users
    columns:
      - name: customer_id
        data_type: int64
        data_tests:
          - unique
          - not_null
      - name: customer_first_name
        data_type: string
      - name: customer_last_name
        data_type: string
      - name: customer_full_name
        data_type: string
      - name: customer_email
        data_type: string
      - name: customer_age
        data_type: int64
      - name: customer_gender
        data_type: string
      - name: customer_street_address
        data_type: string
      - name: customer_postal_code
        data_type: string
      - name: customer_city
        data_type: string
      - name: customer_state
        data_type: string
      - name: customer_country
        data_type: string
      - name: customer_latitude
        data_type: float64
      - name: customer_longitude
        data_type: float64
      - name: customer_geom
        data_type: geography
      - name: customer_traffic_source
        data_type: string
      - name: created_at
        data_type: timestamp


--stg_thelook_ecommerce__products

  - name: stg_thelook_ecommerce__products
    columns:
      - name: product_id
        data_type: int64
        data_tests:
          - unique
          - not_null
      - name: distribution_center_id
        data_type: int64
      - name: product_name
        data_type: string
      - name: product_category
        data_type: string
      - name: product_brand
        data_type: string
      - name: product_department
        data_type: string
      - name: product_sku
        data_type: string
      - name: product_cost
        data_type: float64
      - name: product_retail_price
        data_type: float64


--stg_thelook_ecommerce__order_items

  - name: stg_thelook_ecommerce__order_items
    columns:
      - name: item_id
        data_type: int64
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_type: int64
      - name: customer_id
        data_type: int64
      - name: product_id
        data_type: int64
      - name: inventory_item_id
        data_type: int64
      - name: item_status
        data_type: string
      - name: created_at
        data_type: timestamp
      - name: shipped_at
        data_type: timestamp
      - name: delivered_at
        data_type: timestamp
      - name: returned_at
        data_type: timestamp
      - name: item_sale_price
        data_type: float64