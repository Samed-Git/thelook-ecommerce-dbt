version: 2

models:
  - name: stg_thelook_ecommerce__orders
    description: "Staged order records from thelook_ecommerce source dataset."
    columns:
      - name: order_id
        description: "Primary key for each order."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key referencing the customer."
        tests:
          - not_null

      - name: order_status
        description: "Status of the order."
        tests:
          - accepted_values:
              arguments:
                values: ['Cancelled', 'Complete', 'Processing', 'Returned', 'Shipped']

      - name: creation_date
        description: "Timestamp when the order was created."
        

  - name: stg_thelook_ecommerce__users
    description: "Staged customer records from thelook_ecommerce source dataset."
    columns:
      - name: customer_id
        data_type: int64
        description: "Primary key for each customer."
        tests:
          - unique
          - not_null

      - name: customer_first_name
        data_type: string
        description: ""

      - name: customer_last_name
        data_type: string
        description: ""

      - name: customer_email
        data_type: string
        description: ""

      - name: customer_age
        data_type: int64
        description: ""

      - name: customer_gender
        data_type: string
        description: ""

      - name: customer_street_address
        data_type: string
        description: ""

      - name: customer_postal_code
        data_type: string
        description: ""

      - name: customer_city
        data_type: string
        description: ""

      - name: customer_state
        data_type: string
        description: ""

      - name: customer_country
        data_type: string
        description: ""

      - name: customer_latitude
        data_type: float64
        description: ""

      - name: customer_longitude
        data_type: float64
        description: ""

      - name: customer_geom
        data_type: geography
        description: ""

      - name: traffic_source
        data_type: string
        description: ""

      - name: created_at
        data_type: timestamp
        description: ""